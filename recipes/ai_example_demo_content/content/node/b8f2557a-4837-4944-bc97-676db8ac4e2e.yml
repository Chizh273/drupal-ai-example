  body:
    -
      value: 'An e-commerce retailer serving English and Arabic-speaking customers needed voice-driven product search across a 40,000-SKU catalog. The solution combined the browser Web Speech API for speech-to-text with a Drupal-native RAG pipeline: ai_search chunks and embeds product descriptions, ai_vdb_provider_pinecone stores the vectors, and ai_assistant_api answers using retrieved context before the browser speaks the response back via text-to-speech. Roughly 80% of the original RFP requirements were met through contrib configuration alone, with under 150 lines of custom JavaScript for the microphone button and audio playback.'
