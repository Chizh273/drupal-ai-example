      langcode: en
      alias: null
  body:
    -
      value: "As of ai_assistant_api 1.4.8, native tool-calling (use_function_calling: true) builds its tool schema through the AiAssistantAction plugin manager but decodes the model's tool-call response through a different, generic plugin manager, so results never wire back to the conversation. The documented workaround is to disable native function calling and use the prompt-based JSON action protocol instead (use_function_calling: false), which this project's Site Assistant does."
      format: basic_html
