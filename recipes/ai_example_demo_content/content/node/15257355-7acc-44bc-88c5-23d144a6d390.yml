  body:
    -
      value: "Usually not. The drupal/ai ecosystem covers most standard use cases (chat assistants, RAG search, editorial AI tools, text-to-action agents) through configuration and light custom tool plugins. A dedicated Node.js or Python microservice is worth the added complexity mainly when you need true token-streaming ergonomics or full frontend framework freedom, both real trade-offs documented in this project's case studies."
