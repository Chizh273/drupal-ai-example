      value: 'A manufacturing operator built a Drupal-based chatbot letting floor technicians ask equipment-specific questions and log maintenance actions hands-free. The assistant uses a custom AiFunctionCall tool to query equipment records and open work orders, and the ai_context Context Control Center injects safety-procedure context so answers always include the correct lockout-tagout warnings for the equipment being discussed, a concrete example of governance changing model output, not just a policy document.'
