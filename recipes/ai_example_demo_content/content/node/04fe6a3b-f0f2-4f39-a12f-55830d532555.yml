  body:
    -
      value: 'A regional hospital network replaced static wayfinding kiosks with a conversational AI assistant built on Drupal. Visitors ask natural-language questions like "where is radiology" or "when does the cafeteria open" and get instant, accurate answers pulled from live Drupal content. The assistant also handles device-level actions: restarting a frozen kiosk, redeploying a layout to a specific floor, or scheduling a maintenance window, all through custom AiFunctionCall tools. Built with drupal/ai, ai_agents for adaptive multi-step troubleshooting, and a lightweight Node.js proxy only where token-streaming ergonomics mattered.'
